<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banga-an's Midterm Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #dce9e4;
            color: #020202;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        header {
            background-color: #0b96e7;
            color: white;
            flex-shrink: 0;
        }

        .top-header {
            height: 105px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid #71827e;
        }

        .logo {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #b7d8c9;
            object-fit: cover;
        }

        .brand {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav {
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 23px 45px;
            font-size: 17px;
            font-weight: bold;
        }

        nav a:hover,
        nav a.active {
            background-color: #3e514c;
        }

        main {
            flex: 1;
            display: flex;
            padding: 3vh 7%;
        }

        .hero {
            background-color: #eef5f1;
            flex: 1;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2vh 40px;
        }

        .hero h1 {
            font-size: clamp(20px, 3.4vh, 34px);
            color: #000000;
            margin-bottom: 1vh;
            letter-spacing: 1px;
        }

        .hero h2 {
            font-size: clamp(13px, 2vh, 18px);
            font-weight: normal;
            font-style: italic;
            margin-bottom: 3vh;
            color: #070707;
        }

        .profiles {
            display: flex;
            gap: clamp(12px, 3vh, 28px);
            margin-bottom: 3vh;
        }

        .profiles img {
            width: clamp(60px, 14vh, 115px);
            height: clamp(60px, 14vh, 115px);
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #607d73;
        }

        .description {
            max-width: 750px;
            font-size: clamp(12px, 2vh, 18px);
            line-height: 1.6;
            margin-bottom: 3vh;
        }

        .learn-more {
            display: inline-block;
            background-color: #344944;
            color: white;
            text-decoration: none;
            padding: clamp(10px, 1.8vh, 16px) clamp(24px, 4vh, 38px);
            font-size: clamp(12px, 1.9vh, 16px);
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .learn-more:hover {
            background-color: #607d73;
        }


        footer {
            background-color: #283936;
            color: white;
            text-align: center;
            padding: 22px;
            font-size: 14px;
            flex-shrink: 0;
        }


        @media (max-width: 700px) {

            .brand {
                font-size: 20px;
            }

            nav a {
                padding: 20px 12px;
                font-size: 13px;
            }

            .hero {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="top-header">

            <div class="brand">
                Banga-an's Midterm Portfolio
            </div>

        </div>

        <nav>
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="services.html">SERVICES</a>
            <a href="media.html" >MEDIA</a>
            <a href="contact.html" class="active">CONTACT</a>
        </nav>

    </header>

    <main>

        <section class="hero">

            <div class="profiles">

                <img src="photo.jpg" alt="Creative Image 1">


            </div>

            <h1>Contact Details</h1>

            <div class="contact-content">
                <div class="contact-details">
                    <h2>CONTACT DETAILS</h2>
                    <div class="detail">
                        <h3>FACEBOOK</h3>
                        <p>JUN BANGA-AN</p>
                    </div>
                    <div class="detail">
                        <h3>INSTAGRAM</h3>
                        <p>@supp.jun</p>
                    </div>
                    <div class="detail">
                        <h3>PHONE NUMBER</h3>
                        <p>09487541625</p>
                    </div>
                </div>
                <form class="contact-form"
                      action="mailto:YOUR-EMAIL@example.com"
                      method="post"
                      enctype="text/plain">
                    <label for="fullname">FULL NAME</label>
                    <input type="text" id="fullname" name="Full Name"
                           placeholder="Your Name" required>
                    <label for="email">EMAIL ADDRESS</label>
                    <input type="email" id="email" name="Email"
                           placeholder="email@example.com" required>
                    <label for="message">COMMENTS / MESSAGE</label>
                    <textarea id="message" name="Message"
                              placeholder="Write your message here..."
                              required></textarea>
                    <button type="submit">SEND MESSAGE</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        &copy; 2026 Banga-an's Creatives
    </footer>
</body>
</html>
